<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <!-- Light Theme Variant: NovaPay Design System -->
  <defs>
    <linearGradient id="p1bgLight" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#p1bgLight)"/>
  
  <!-- Outer Window Container -->
  <rect x="35" y="25" width="530" height="350" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="35" y="25" width="530" height="42" rx="14" fill="#F1F5F9"/>
  <circle cx="60" cy="46" r="5" fill="#EF4444"/>
  <circle cx="76" cy="46" r="5" fill="#F59E0B"/>
  <circle cx="92" cy="46" r="5" fill="#10B981"/>
  <text x="115" y="50" font-family="'JetBrains Mono', monospace" font-size="12" fill="#475569">novapay-design-system.fig / v2.4</text>
  
  <!-- Left Token Palette Column (x: 55, width: 145) -->
  <!-- Token Swatch -->
  <rect x="55" y="85" width="145" height="60" rx="10" fill="#F59E0B"/>
  <text x="68" y="110" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#0A0D14">Primary 500</text>
  <text x="68" y="130" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0A0D14">#F59E0B • AA</text>

  <!-- Button.Primary Preview -->
  <rect x="55" y="155" width="145" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="70" y="182" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#0F172A">Button.Primary</text>
  <circle cx="178" cy="177" r="4" fill="#D97706"/>

  <!-- Button.Ghost Preview -->
  <rect x="55" y="210" width="145" height="44" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="70" y="237" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#475569">Button.Ghost</text>

  <!-- Badge 450+ Tokens -->
  <rect x="55" y="265" width="145" height="85" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="70" y="295" font-family="'JetBrains Mono', monospace" font-size="11" fill="#047857">TOKEN MATRIX</text>
  <text x="70" y="322" font-family="'Syne', sans-serif" font-weight="700" font-size="16" fill="#0F172A">450+ Tokens</text>
  <text x="70" y="338" font-family="'Inter', sans-serif" font-size="10" fill="#475569">100% Exported</text>

  <!-- Right Fintech Dashboard Column (x: 220, width: 325) -->
  <!-- Top Analytics Container -->
  <rect x="220" y="85" width="325" height="155" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  
  <text x="240" y="112" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="0.05em">TRANSACTION VOLUME (24H)</text>
  
  <text x="240" y="142" font-family="'Syne', sans-serif" font-weight="800" font-size="24" fill="#0F172A">$1,489,200</text>
  <!-- Percentage Growth Pill -->
  <rect x="420" y="125" width="105" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="432" y="141" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#047857">+34.2% ARR</text>

  <!-- Bar Chart Visualizer -->
  <g transform="translate(240, 160)">
    <rect x="0" y="38" width="16" height="22" rx="3" fill="#CBD5E1"/>
    <rect x="24" y="26" width="16" height="34" rx="3" fill="#CBD5E1"/>
    <rect x="48" y="44" width="16" height="16" rx="3" fill="#CBD5E1"/>
    <rect x="72" y="18" width="16" height="42" rx="3" fill="#94A3B8"/>
    <rect x="96" y="8" width="16" height="52" rx="3" fill="#F59E0B"/>
    <rect x="120" y="0" width="16" height="60" rx="3" fill="#0284C7"/>
    <rect x="144" y="14" width="16" height="46" rx="3" fill="#CBD5E1"/>
    <rect x="168" y="20" width="16" height="40" rx="3" fill="#CBD5E1"/>
    <rect x="192" y="2" width="16" height="58" rx="3" fill="#059669"/>
    <line x1="0" y1="60" x2="280" y2="60" stroke="#CBD5E1" stroke-width="1"/>
  </g>

  <!-- Bottom Row Bento Cards -->
  <rect x="220" y="255" width="155" height="95" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="236" y="280" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.05em">DESIGN SYSTEM</text>
  <text x="236" y="306" font-family="'Syne', sans-serif" font-weight="700" font-size="14" fill="#0F172A">NovaPay 2.0</text>
  <text x="236" y="326" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#D97706">+34% Dev Velocity</text>

  <rect x="390" y="255" width="155" height="95" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="406" y="280" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.05em">ACCESSIBILITY</text>
  <text x="406" y="306" font-family="'Syne', sans-serif" font-weight="700" font-size="14" fill="#0F172A">WCAG 2.1 AA</text>
  <text x="406" y="326" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#047857">100% Pass Rate</text>
</svg>
