<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <!-- Stylized Designer Portrait Card Graphic (Light Theme) -->
  <defs>
    <linearGradient id="bgGradLight" x1="0" y1="0" x2="400" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="amberGlowLight" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.16)"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)"/>
    </radialGradient>
    <radialGradient id="cyanGlowLight" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="rgba(2, 132, 199, 0.12)"/>
      <stop offset="100%" stop-color="rgba(2, 132, 199, 0)"/>
    </radialGradient>
    <filter id="softShadowLight" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <rect width="400" height="480" rx="24" fill="url(#bgGradLight)"/>
  <circle cx="200" cy="180" r="170" fill="url(#amberGlowLight)"/>
  <circle cx="100" cy="380" r="140" fill="url(#cyanGlowLight)"/>
  
  <!-- Subtle geometric grid pattern in light background -->
  <g stroke="rgba(15, 23, 42, 0.05)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="480"/>
    <line x1="120" y1="0" x2="120" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="280" y1="0" x2="280" y2="480"/>
    <line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="400" x2="400" y2="400"/>
  </g>

  <!-- Vector Avatar Silhouette / Contemporary Character -->
  <g id="portrait-character-light" transform="translate(50, 40)" filter="url(#softShadowLight)">
    <!-- Head and Outer Silhouette -->
    <path d="M150 70C110 70 85 100 85 150C85 190 100 220 150 220C200 220 215 190 215 150C215 100 190 70 150 70Z" fill="#1E293B"/>
    <!-- Face Contour -->
    <path d="M150 85C125 85 105 105 105 140C105 175 125 195 150 195C175 195 195 175 195 140C195 105 175 85 150 85Z" fill="#FFFFFF"/>
    <!-- Modern Minimalist Eyewear (Amber Accent) -->
    <rect x="118" y="130" width="28" height="18" rx="6" fill="rgba(245, 158, 11, 0.08)" stroke="#D97706" stroke-width="3"/>
    <rect x="154" y="130" width="28" height="18" rx="6" fill="rgba(245, 158, 11, 0.08)" stroke="#D97706" stroke-width="3"/>
    <line x1="146" y1="139" x2="154" y2="139" stroke="#D97706" stroke-width="3"/>
    <!-- Shoulders & Coat -->
    <path d="M60 360C60 270 100 240 150 240C200 240 240 270 240 360H60Z" fill="#334155"/>
    <path d="M125 240L150 310L175 240H125Z" fill="#1E293B"/>
    <path d="M148 275L150 360L152 275" stroke="#F59E0B" stroke-width="2.5"/>
  </g>

  <!-- Floating UI Elements -->
  <!-- Availability pill badge (Top Section) -->
  <g transform="translate(24, 24)">
    <rect width="180" height="32" rx="16" fill="rgba(236, 253, 245, 0.95)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#059669"/>
    <text x="28" y="16" dominant-baseline="central" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#047857" letter-spacing="0.04em">AVAILABLE FOR WORK</text>
  </g>

  <!-- Experience pill badge (Bottom Section - Perfectly Aligned) -->
  <g transform="translate(24, 422)">
    <rect width="180" height="34" rx="17" fill="rgba(255, 255, 255, 0.96)" stroke="rgba(217, 119, 6, 0.45)" stroke-width="1.2"/>
    <!-- Centered Amber Lightning Bolt Icon -->
    <path d="M19 10L14 17H17.5L15.5 24L21 16H17.5L19 10Z" fill="#D97706"/>
    <text x="27" y="17" dominant-baseline="central" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#0F172A" letter-spacing="0.02em">8+ Years Experience</text>
  </g>
</svg>
