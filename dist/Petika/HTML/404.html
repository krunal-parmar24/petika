<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <title>Page Not Found (404) — Petika</title>
  <meta name="description" content="The requested page could not be found. Return to Petika single page portfolio.">
  <meta name="author" content="KD Themes">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">

  <!-- Inline Pre-Render Theme Script -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('petika-theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', initialTheme);
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      }
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column justify-content-between min-vh-100">

  <!-- Simple Header -->
  <header class="petika-navbar position-static py-4">
    <div class="container-xxl">
      <div class="d-flex align-items-center justify-content-between">
        <a href="index.html" class="navbar-brand-wrap" aria-label="Petika Home">
          <img src="assets/images/logo/logo-dark.svg" alt="Petika Logo" class="logo-img-dark">
          <img src="assets/images/logo/logo-light.svg" alt="Petika Logo" class="logo-img-light">
        </a>
        <button type="button" class="theme-toggle-btn js-theme-toggle" aria-label="Toggle theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 404 Main Content -->
  <main class="my-auto py-5">
    <div class="container-xxl text-center">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="bento-card p-5">
            <span class="section-eyebrow">Error 404</span>
            <div class="metric-number text-accent mb-3" style="font-size: 5rem;">404</div>
            <h1 class="h2 mb-3">Page Not Found</h1>
            <p class="text-secondary-subtle mb-4">
              The page you are looking for might have been moved, renamed, or is temporarily unavailable. Return to the main portfolio showcase.
            </p>
            <div class="d-flex justify-content-center gap-3">
              <a href="index.html" class="btn-petika-primary">
                <span>Back to Homepage</span>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Simple Footer -->
  <footer class="petika-footer">
    <div class="container-xxl text-center">
      <p class="footer-copy mb-0">&copy; 2026 <strong>Petika</strong>. Crafted with Precision &amp; Bootstrap 5.3. All rights reserved.</p>
    </div>
  </footer>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
