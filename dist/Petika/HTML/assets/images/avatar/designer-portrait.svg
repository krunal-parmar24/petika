<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <!-- Stylized Designer Portrait Card Graphic -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#182032"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.25)"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.18)"/>
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0)"/>
    </radialGradient>
  </defs>
  <rect width="400" height="480" rx="24" fill="url(#bgGrad)"/>
  <circle cx="200" cy="180" r="160" fill="url(#amberGlow)"/>
  <circle cx="100" cy="380" r="140" fill="url(#cyanGlow)"/>
  
  <!-- Subtle geometric grid pattern in background -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="480"/>
    <line x1="120" y1="0" x2="120" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="280" y1="0" x2="280" y2="480"/>
    <line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="400" x2="400" y2="400"/>
  </g>

  <!-- Vector Avatar Silhouette / Contemporary Character -->
  <g id="portrait-character" transform="translate(50, 40)">
    <!-- Head and Hair -->
    <path d="M150 70C110 70 85 100 85 150C85 190 100 220 150 220C200 220 215 190 215 150C215 100 190 70 150 70Z" fill="#2A344A"/>
    <path d="M150 85C125 85 105 105 105 140C105 175 125 195 150 195C175 195 195 175 195 140C195 105 175 85 150 85Z" fill="#F8FAFC" opacity="0.95"/>
    <!-- Modern Minimalist Eyewear -->
    <rect x="118" y="130" width="28" height="18" rx="6" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <rect x="154" y="130" width="28" height="18" rx="6" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <line x1="146" y1="139" x2="154" y2="139" stroke="#F59E0B" stroke-width="3"/>
    <!-- Shoulders & Coat -->
    <path d="M60 360C60 270 100 240 150 240C200 240 240 270 240 360H60Z" fill="#1E293B"/>
    <path d="M125 240L150 310L175 240H125Z" fill="#0A0D14"/>
    <path d="M148 275L150 360L152 275" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Floating UI Elements -->
  <!-- Availability pill badge -->
  <g transform="translate(24, 28)">
    <rect width="180" height="32" rx="16" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#10B981"/>
    <text x="28" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#10B981" letter-spacing="0.04em">AVAILABLE FOR WORK</text>
  </g>

  <!-- Experience pill badge -->
  <g transform="translate(24, 420)">
    <rect width="170" height="34" rx="17" fill="rgba(17, 23, 38, 0.85)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
    <text x="18" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F8FAFC">⚡ 8+ Years Experience</text>
  </g>
</svg>