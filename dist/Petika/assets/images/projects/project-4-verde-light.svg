<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <!-- Light Theme Variant: Verde Botanicals E-Commerce -->
  <defs>
    <linearGradient id="p4bgLight" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#p4bgLight)"/>
  
  <!-- Window Container -->
  <rect x="35" y="25" width="530" height="350" rx="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
  <rect x="35" y="25" width="530" height="42" rx="14" fill="#F0FDF4"/>
  <circle cx="60" cy="46" r="5" fill="#EF4444"/>
  <circle cx="76" cy="46" r="5" fill="#F59E0B"/>
  <circle cx="92" cy="46" r="5" fill="#10B981"/>
  <text x="115" y="51" font-family="'JetBrains Mono', monospace" font-size="12" fill="#047857">verde-botanicals.shop / flagship-store</text>

  <!-- Editorial E-Commerce Showcase (Left Column) -->
  <rect x="55" y="85" width="235" height="265" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  
  <!-- Stylized Luxury Product Bottle -->
  <rect x="150" y="115" width="45" height="90" rx="8" fill="#059669"/>
  <rect x="162" y="100" width="21" height="18" rx="4" fill="#D97706"/>
  <line x1="162" y1="130" x2="183" y2="130" stroke="#FFFFFF" stroke-width="2"/>
  <text x="172" y="165" font-family="'Syne', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">VERDE</text>
  
  <text x="172" y="235" font-family="'Syne', sans-serif" font-weight="700" font-size="15" fill="#0F172A" text-anchor="middle">Botanical Elixir No. 4</text>
  <text x="172" y="255" font-family="'Inter', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Organic Restorative Skincare</text>
  
  <rect x="105" y="280" width="135" height="38" rx="19" fill="#059669"/>
  <text x="172" y="304" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#FFFFFF" text-anchor="middle">Add to Cart • $68</text>

  <!-- Metric Callout Cards on Right Column -->
  <rect x="310" y="85" width="235" height="120" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="330" y="115" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="0.05em">CHECKOUT CONVERSION</text>
  <text x="330" y="155" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="28" fill="#047857">+48.6%</text>
  <text x="330" y="180" font-family="'Inter', sans-serif" font-size="11" fill="#0F172A">A/B Tested with 120,000 visitors</text>

  <rect x="310" y="225" width="235" height="125" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="330" y="255" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="0.05em">PAGE SPEED &amp; VITALS</text>
  <text x="330" y="295" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="28" fill="#D97706">0.8s LCP</text>
  <text x="330" y="322" font-family="'Inter', sans-serif" font-size="11" fill="#0F172A">100/100 Mobile Performance</text>
</svg>
