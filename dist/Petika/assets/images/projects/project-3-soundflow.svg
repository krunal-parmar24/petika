<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="p3bg" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1528"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#p3bg)"/>
  
  <!-- Mobile Device Frame Mockup -->
  <g transform="translate(190, 20)">
    <rect width="220" height="360" rx="36" fill="#0A0D14" stroke="rgba(245, 158, 11, 0.4)" stroke-width="3"/>
    <!-- Speaker & Notch -->
    <rect x="80" y="10" width="60" height="12" rx="6" fill="#1E293B"/>
    <!-- Phone Screen Content -->
    <rect x="12" y="30" width="196" height="300" rx="24" fill="#111726"/>
    <!-- Album Art Circle with Audio Waves -->
    <circle cx="110" cy="120" r="55" fill="#182032" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="110" cy="120" r="35" fill="#0A0D14" stroke="#06B6D4" stroke-width="1.5"/>
    <circle cx="110" cy="120" r="15" fill="#F59E0B"/>
    
    <text x="110" y="205" font-family="'Syne', sans-serif" font-weight="700" font-size="14" fill="#F8FAFC" text-anchor="middle">Spatial Echoes</text>
    <text x="110" y="222" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">SoundFlow Audio Engine</text>

    <!-- Player Controls -->
    <rect x="35" y="245" width="150" height="4" rx="2" fill="#1E293B"/>
    <rect x="35" y="245" width="95" height="4" rx="2" fill="#F59E0B"/>
    <circle cx="130" cy="247" r="4" fill="#F8FAFC"/>

    <!-- Play/Pause Pill -->
    <circle cx="110" cy="280" r="18" fill="#F59E0B"/>
    <polygon points="106,272 118,280 106,288" fill="#0A0D14"/>
  </g>

  <!-- Left Float Badge -->
  <g transform="translate(40, 100)">
    <rect width="130" height="60" rx="10" fill="#111726" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="15" y="28" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">APP STORE</text>
    <text x="15" y="48" font-family="'Syne', sans-serif" font-weight="700" font-size="14" fill="#F59E0B">4.9 ★★★★★</text>
  </g>

  <!-- Right Float Badge -->
  <g transform="translate(430, 220)">
    <rect width="130" height="60" rx="10" fill="#111726" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="15" y="28" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">DAILY USERS</text>
    <text x="15" y="48" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" fill="#10B981">150,000+ DAU</text>
  </g>
</svg>